version: '3.8'

services:
  ml-engine:
    build:
      context: ./ml-engine
    container_name: ndt-ml-engine
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ndt-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - ML_BASE_URL=http://ml-engine:8000
      - ML_ENGINE_URL=http://ml-engine:8000/predict-congestion
    depends_on:
      - ml-engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ndt-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

